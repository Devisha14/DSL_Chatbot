
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cybersecurity Awareness Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">
            <h1>Cybersecurity Awareness Chatbot</h1>
            <p>Ask me anything about cybersecurity</p>
        </div>

        <!-- Chat Area -->
        <div class="chat-box" id="chatBox">

            <div class="message bot-message">
                <div class="message-content">
                    Hello! I am your Cybersecurity Awareness Assistant.
                    <br><br>
                    You can ask me about:
                    <br>
                    • Phishing
                    <br>
                    • Malware
                    <br>
                    • Ransomware
                    <br>
                    • Password Security
                    <br>
                    • DDoS Attacks
                    <br>
                    • Identity Theft
                    <br>
                    • Social Engineering
                    <br>
                    • Safe Browsing
                    <br>
                    • Two-Factor Authentication
                </div>
            </div>

        </div>

        <!-- Input Area -->
        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your cybersecurity question..."
                autocomplete="off"
            >

            <button id="sendButton">Send</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
